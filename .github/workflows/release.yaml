---
name: 🚀 Release

on:
  push:
    tags:
      - v*

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: 🧪 CI
    uses: ./.github/workflows/ci.yaml

  release:
    name: 🚀 Release
    runs-on: ubuntu-latest
    needs:
      - ci

    permissions:
      contents: write
      packages: write

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v7

      # Before anything is pushed, so a missing CHANGELOG section stops the release.
      - name: 📝 Extract release notes from CHANGELOG.md
        run: |
          awk -v version="${GITHUB_REF_NAME#v}" '
            index($0, "## [" version "]") == 1 { found = 1; next }
            found && (/^## \[/ || /^\[[^]]+\]: /) { exit }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          test -s "$RUNNER_TEMP/notes.md"

          cat >> "$RUNNER_TEMP/notes.md" <<NOTES

          ## Install

          \`\`\`sh
          docker run --rm -p 8080:8080 ghcr.io/kloudkit/looking-glass:$GITHUB_REF_NAME
          \`\`\`
          NOTES

      - name: 🧰 Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: 🧰 Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: 🔑 Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 📃 Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}

      - name: 🐳 Docker Build & Push
        uses: docker/build-push-action@v7
        id: docker_build
        env:
          DOCKER_BUILD_SUMMARY: true
        with:
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            version=${{ github.ref_name }}
          context: .
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          provenance: false
          push: true
          tags: ${{ steps.meta.outputs.tags }}

      - name: 🔖 Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --verify-tag
